{%  extends 'master/base.html' %}
{%  block container  %}

<h1>Cash List</h1>

<a href="{%  url 'add_cash'  %}" class="btn btn-primary">Add Cash</a>

<table class="table table-success table-striped">
  <thead>
    <tr>
      <th>SL</th>
      <th>User</th>
      <th>Source</th>
      <th>Amount</th>
      <th>Date Time</th>
      <th>Description</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {%  for i in data  %}

      <tr>
        <td>{{forloop.counter}}</td>
        <td>{{i.user}}</td>
        <td>{{i.source}}</td>
        <td>{{i.amount}}</td>
        <td>{{i.datetime}}</td>
        <td>{{i.description}}</td>
        <td>
          <a href="{%  url 'edit_cash' i.id %}" class="btn btn-primary">Edit</a>
          <a href="{%  url 'delete_cash' i.id  %}" class="btn btn-danger">Delete</a>
        </td>
        
      </tr>


    {%  endfor  %}
  </tbody>
</table>


{%  endblock container  %}
